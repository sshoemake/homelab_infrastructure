name: portainer

services:
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:?PORTAINER_VERSION must be set}
    container_name: portainer
    restart: always
    ports:
      - "8000:8000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  portainer_data:
    external: true
