name: homeassistant

services:
  homeassistant:
    container_name: homeassistant
    image: ${HA_IMAGE:?HA_IMAGE must be configured in .env}
    restart: unless-stopped
    network_mode: host

    environment:
      TZ: ${TZ:-US/Arizona}

    volumes:
      - /home/odroid/homeassistant/config:/config
